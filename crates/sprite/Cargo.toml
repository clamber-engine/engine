[package]
name = "clamber-sprite"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Sprites: PNG sheets with Aseprite JSON metadata, palettes, atlases"

[dependencies]
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
