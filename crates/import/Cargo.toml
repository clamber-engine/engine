[package]
name = "clamber-import"
version = "0.1.0"
edition.workspace = true
publish = false
description = "The importer: turns a player's own game image into a personal content pack"

[dependencies]
clamber-fixed = { path = "../fixed" }
clamber-level = { path = "../level" }
clamber-sprite = { path = "../sprite" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"

