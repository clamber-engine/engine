[package]
name = "clamber-conformance"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Engine traces against goldens and the spec: the clamber-trace CLI, golden and conformance tests"

[[bin]]
name = "clamber-trace"
path = "src/main.rs"

[[test]]
name = "conformance"
harness = false

[dependencies]
clamber-level = { path = "../level" }
clamber-pack = { path = "../pack" }
clamber-sim = { path = "../sim" }
clamber-trace = { path = "../trace" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
