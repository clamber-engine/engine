[package]
name = "clamber-input"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Player input: neutral actions, remappable bindings, gamepads"

[features]
# Gamepads through gilrs. Off by default because on Linux it links
# libudev, which needs the system's development package to build.
gamepad = ["dep:gilrs"]

[dependencies]
gilrs = { version = "0.11.2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", features = ["preserve_order"] }
