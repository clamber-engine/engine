[package]
name = "clamber-art"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Placeholder art and sound generated from code: SVG to sprite sheets, synthesized WAVs"

[dependencies]
clamber-sprite = { path = "../sprite" }
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.1.8"
