[package]
name = "clamber-level"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Levels: layers, entities, collision, regions and camera rules; Tiled import"

[dependencies]
clamber-fixed = { path = "../fixed" }
clamber-pack = { path = "../pack" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = { version = "1.1.8", features = ["preserve_order"] }
