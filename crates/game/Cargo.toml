[package]
name = "clamber-game"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The Clamber game: a window, the simulation at 60 Hz, rendering and input"

[features]
# Sound output. Off by default because on Linux it links ALSA, which
# needs the system's development package to build.
audio = ["clamber-audio/output"]
gamepad = ["clamber-input/gamepad"]

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
clamber-audio = { path = "../audio" }
clamber-fixed = { path = "../fixed" }
clamber-import = { path = "../import" }
clamber-input = { path = "../input" }
clamber-level = { path = "../level" }
clamber-pack = { path = "../pack" }
clamber-sim = { path = "../sim" }
clamber-sprite = { path = "../sprite" }
clamber-trace = { path = "../trace" }
clamber-worldmap = { path = "../worldmap" }
fontdue = "0.9.4"
gif = { version = "0.14.2", default-features = false, features = ["std"] }
png = "0.18.1"
pollster = "1.0.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
softbuffer = "0.4.8"
toml = "1.1.8"
wgpu = "30.0.1"
winit = "0.30.13"

# Release builds on Windows run without a console, so fatal errors show
# in a message box and `--console` can open one.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
