<svg xmlns="http://www.w3.org/2000/svg" width="96" height="24" viewBox="0 0 96 24" shape-rendering="crispEdges">
  <!-- The flutter: a lantern moth that flies a fixed path. Faces right.
       24x24 frames; the origin is the middle (12, 12). -->
  <defs>
    <g id="body">
      <path d="M11 7 L9 2 M13 7 L15 2" stroke="#1d1a2b" stroke-width="1"/>
      <circle cx="9" cy="2" r="1.5" fill="#ffd23f"/>
      <circle cx="15" cy="2" r="1.5" fill="#ffd23f"/>
      <circle cx="12" cy="13" r="7" fill="#1d1a2b"/>
      <circle cx="12" cy="13" r="6" fill="#f4a259"/>
      <rect x="6" y="14" width="12" height="2" fill="#e07a3f"/>
      <ellipse cx="12" cy="17.5" rx="3" ry="1.5" fill="#ffe9a8"/>
    </g>
    <g id="eye">
      <circle cx="15" cy="11" r="2" fill="#ffffff"/>
      <rect x="16" y="10" width="1" height="2" fill="#1d1a2b"/>
    </g>
    <g id="wing">
      <ellipse cx="0" cy="0" rx="6" ry="3.5" fill="#1d1a2b"/>
      <ellipse cx="0" cy="0" rx="5" ry="2.5" fill="#bfe3f0"/>
    </g>
  </defs>

  <!-- 0-2 fly: wing up, level, down -->
  <g>
    <use href="#wing" transform="translate(8 6) rotate(-35)"/>
    <use href="#body"/>
    <use href="#eye"/>
  </g>
  <g transform="translate(24 0)">
    <use href="#wing" transform="translate(5 11)"/>
    <use href="#body"/>
    <use href="#eye"/>
  </g>
  <g transform="translate(48 0)">
    <use href="#wing" transform="translate(6 17) rotate(35)"/>
    <use href="#body"/>
    <use href="#eye"/>
  </g>

  <!-- 3 defeated: wings folded, dazed -->
  <g transform="translate(72 0)">
    <use href="#wing" transform="translate(7 18) rotate(70)"/>
    <use href="#body"/>
    <path d="M14 9 L17 12 M17 9 L14 12" stroke="#1d1a2b" stroke-width="1"/>
  </g>
</svg>
