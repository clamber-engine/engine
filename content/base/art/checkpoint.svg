<svg xmlns="http://www.w3.org/2000/svg" width="72" height="48" viewBox="0 0 72 48" shape-rendering="crispEdges">
  <!-- The checkpoint: a trail marker that raises its pennant when
       reached. 24x48 frames; the post's foot is the origin (8, 48). -->
  <defs>
    <g id="post">
      <rect x="6" y="2" width="4" height="44" fill="#1d1a2b"/>
      <rect x="7" y="3" width="2" height="43" fill="#c9c3b5"/>
      <rect x="3" y="43" width="10" height="5" rx="1" fill="#1d1a2b"/>
      <rect x="4" y="44" width="8" height="3" fill="#8d8a9b"/>
      <circle cx="8" cy="3" r="2.5" fill="#1d1a2b"/>
      <circle cx="8" cy="3" r="1.5" fill="#ffd23f"/>
    </g>
  </defs>

  <!-- 0 waiting: pennant furled low and grey -->
  <use href="#post"/>
  <path d="M9 30 L17 33 L9 36 Z" fill="#9aa0a6" stroke="#1d1a2b" stroke-width="1"/>

  <!-- 1-2 reached: pennant up and waving -->
  <g transform="translate(24 0)">
    <use href="#post"/>
    <path d="M9 6 L22 9 L9 14 Z" fill="#f25f5c" stroke="#1d1a2b" stroke-width="1"/>
  </g>
  <g transform="translate(48 0)">
    <use href="#post"/>
    <path d="M9 6 L16 7 L22 11 L9 14 Z" fill="#f25f5c" stroke="#1d1a2b" stroke-width="1"/>
  </g>
</svg>
