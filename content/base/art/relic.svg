<svg xmlns="http://www.w3.org/2000/svg" width="32" height="16" viewBox="0 0 32 16" shape-rendering="crispEdges">
  <!-- The relic, the rare pickup: a sun-stone that glints on its second
       frame. 16x16 frames; the origin is the middle (8, 8). -->
  <defs>
    <g id="relic">
      <path d="M8 0 L10 5 L16 8 L10 11 L8 16 L6 11 L0 8 L6 5 Z" fill="#1d1a2b"/>
      <path d="M8 2 L9.5 6 L14 8 L9.5 10 L8 14 L6.5 10 L2 8 L6.5 6 Z" fill="#ffd23f"/>
      <circle cx="8" cy="8" r="2.5" fill="#f25f5c"/>
    </g>
  </defs>
  <use href="#relic"/>
  <g transform="translate(16 0)">
    <use href="#relic"/>
    <rect x="9" y="5" width="2" height="2" fill="#fff3b0"/>
    <rect x="4" y="7" width="1" height="2" fill="#fff3b0"/>
  </g>
</svg>
