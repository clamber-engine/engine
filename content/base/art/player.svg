<svg xmlns="http://www.w3.org/2000/svg" width="432" height="32" viewBox="0 0 432 32" shape-rendering="crispEdges">
  <!-- Clamber's climber, facing right. 24x32 frames; feet at the
       bottom centre (12, 32). Colors are the base palette; art.toml
       lists the swaps for other roster slots. -->
  <defs>
    <g id="foot">
      <rect x="0" y="0" width="7" height="4" rx="2" fill="#1d1a2b"/>
      <rect x="1" y="1" width="5" height="2" rx="1" fill="#6b4e3d"/>
    </g>
    <g id="arm">
      <rect x="0" y="0" width="3" height="6" rx="1" fill="#1d1a2b"/>
      <rect x="1" y="1" width="1" height="4" fill="#2f86b0"/>
    </g>
    <g id="tail">
      <rect x="2" y="16" width="5" height="3" fill="#f25f5c"/>
      <rect x="1" y="19" width="3" height="2" fill="#f25f5c"/>
    </g>
    <g id="long-tail">
      <rect x="0" y="15" width="7" height="3" fill="#f25f5c"/>
      <rect x="0" y="18" width="3" height="2" fill="#f25f5c"/>
    </g>
    <g id="torso">
      <rect x="5" y="4" width="14" height="25" rx="7" fill="#1d1a2b"/>
      <rect x="6" y="5" width="12" height="23" rx="6" fill="#3fa7d6"/>
      <ellipse cx="12" cy="22" rx="4" ry="4" fill="#f2e8cf"/>
      <rect x="6" y="15" width="12" height="3" fill="#f25f5c"/>
    </g>
    <g id="eye">
      <ellipse cx="14" cy="10" rx="3" ry="3" fill="#ffffff"/>
      <rect x="15" y="9" width="2" height="3" fill="#1d1a2b"/>
    </g>
    <g id="dazed">
      <ellipse cx="14" cy="10" rx="3" ry="3" fill="#ffffff"/>
      <path d="M12 8 L16 12 M16 8 L12 12" stroke="#1d1a2b" stroke-width="1.5"/>
    </g>
    <g id="upper">
      <use href="#tail"/>
      <use href="#torso"/>
      <use href="#eye"/>
    </g>
    <g id="ball">
      <circle cx="12" cy="21" r="11" fill="#1d1a2b"/>
      <circle cx="12" cy="21" r="10" fill="#3fa7d6"/>
      <path d="M12 11 A10 10 0 0 1 22 21 L12 21 Z" fill="#2f86b0"/>
      <rect x="2" y="19" width="20" height="3" fill="#f25f5c"/>
      <circle cx="17" cy="15" r="2" fill="#ffffff"/>
    </g>
    <path id="sparkle" d="M0 -3 L1 -1 L3 0 L1 1 L0 3 L-1 1 L-3 0 L-1 -1 Z" fill="#ffd23f"/>
  </defs>

  <!-- 0-1 idle: a slow breath -->
  <g>
    <use href="#upper"/>
    <use href="#arm" x="9" y="18"/>
    <use href="#foot" x="5" y="28"/>
    <use href="#foot" x="12" y="28"/>
  </g>
  <g transform="translate(24 0)">
    <use href="#upper" y="1"/>
    <use href="#arm" x="9" y="19"/>
    <use href="#foot" x="5" y="28"/>
    <use href="#foot" x="12" y="28"/>
  </g>

  <!-- 2-5 walk -->
  <g transform="translate(48 0)">
    <use href="#upper"/>
    <use href="#arm" x="8" y="18"/>
    <use href="#foot" x="2" y="28"/>
    <use href="#foot" x="15" y="28"/>
  </g>
  <g transform="translate(72 0)">
    <use href="#upper" y="-1"/>
    <use href="#arm" x="10" y="17"/>
    <use href="#foot" x="7" y="26"/>
    <use href="#foot" x="11" y="28"/>
  </g>
  <g transform="translate(96 0)">
    <use href="#upper"/>
    <use href="#arm" x="11" y="18"/>
    <use href="#foot" x="15" y="28"/>
    <use href="#foot" x="3" y="28"/>
  </g>
  <g transform="translate(120 0)">
    <use href="#upper" y="-1"/>
    <use href="#arm" x="9" y="17"/>
    <use href="#foot" x="11" y="26"/>
    <use href="#foot" x="7" y="28"/>
  </g>

  <!-- 6-9 run: leaning in, scarf streaming -->
  <g transform="translate(144 0)">
    <g transform="rotate(10 12 28)">
      <use href="#long-tail"/>
      <use href="#torso"/>
      <use href="#eye"/>
      <use href="#arm" x="7" y="17"/>
    </g>
    <use href="#foot" x="0" y="27"/>
    <use href="#foot" x="17" y="28"/>
  </g>
  <g transform="translate(168 0)">
    <g transform="rotate(10 12 27)">
      <use href="#long-tail" y="-1"/>
      <use href="#torso" y="-1"/>
      <use href="#eye" y="-1"/>
      <use href="#arm" x="10" y="16"/>
    </g>
    <use href="#foot" x="5" y="24"/>
    <use href="#foot" x="12" y="28"/>
  </g>
  <g transform="translate(192 0)">
    <g transform="rotate(10 12 28)">
      <use href="#long-tail"/>
      <use href="#torso"/>
      <use href="#eye"/>
      <use href="#arm" x="12" y="17"/>
    </g>
    <use href="#foot" x="17" y="27"/>
    <use href="#foot" x="1" y="28"/>
  </g>
  <g transform="translate(216 0)">
    <g transform="rotate(10 12 27)">
      <use href="#long-tail" y="-1"/>
      <use href="#torso" y="-1"/>
      <use href="#eye" y="-1"/>
      <use href="#arm" x="9" y="16"/>
    </g>
    <use href="#foot" x="12" y="24"/>
    <use href="#foot" x="6" y="28"/>
  </g>

  <!-- 10-13 roll: a quarter turn a frame, clockwise -->
  <g transform="translate(240 0)">
    <use href="#ball"/>
  </g>
  <g transform="translate(264 0)">
    <use href="#ball" transform="rotate(90 12 21)"/>
  </g>
  <g transform="translate(288 0)">
    <use href="#ball" transform="rotate(180 12 21)"/>
  </g>
  <g transform="translate(312 0)">
    <use href="#ball" transform="rotate(270 12 21)"/>
  </g>

  <!-- 14 jump: reaching up, feet tucked -->
  <g transform="translate(336 0)">
    <use href="#upper" y="-2"/>
    <use href="#arm" x="16" y="3"/>
    <use href="#foot" x="5" y="26"/>
    <use href="#foot" x="11" y="25"/>
  </g>

  <!-- 15 fall: arms out, feet down -->
  <g transform="translate(360 0)">
    <use href="#upper"/>
    <use href="#arm" transform="translate(17 19) rotate(-90)"/>
    <use href="#foot" x="3" y="28"/>
    <use href="#foot" x="14" y="28"/>
  </g>

  <!-- 16 swap: sparkles as the next character takes over -->
  <g transform="translate(384 0)">
    <use href="#upper"/>
    <use href="#arm" x="9" y="18"/>
    <use href="#foot" x="5" y="28"/>
    <use href="#foot" x="12" y="28"/>
    <use href="#sparkle" x="3" y="5"/>
    <use href="#sparkle" x="21" y="9"/>
    <use href="#sparkle" x="20" y="24"/>
  </g>

  <!-- 17 hurt: dazed, limbs flung out -->
  <g transform="translate(408 0)">
    <use href="#tail"/>
    <use href="#torso"/>
    <use href="#dazed"/>
    <use href="#arm" x="17" y="4"/>
    <use href="#foot" x="2" y="28"/>
    <use href="#foot" x="15" y="28"/>
  </g>
</svg>
