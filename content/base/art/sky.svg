<svg xmlns="http://www.w3.org/2000/svg" width="384" height="216" viewBox="0 0 384 216" shape-rendering="crispEdges">
  <!-- The farthest background: banded sky with clouds. Tiles
       horizontally. -->
  <rect width="384" height="60" fill="#7cc4e8"/>
  <rect y="60" width="384" height="56" fill="#94d0ee"/>
  <rect y="116" width="384" height="50" fill="#acdcf2"/>
  <rect y="166" width="384" height="50" fill="#c6e8f6"/>
  <defs>
    <g id="cloud">
      <ellipse cx="0" cy="6" rx="22" ry="7" fill="#e8f5fb"/>
      <ellipse cx="-8" cy="0" rx="10" ry="8" fill="#ffffff"/>
      <ellipse cx="6" cy="-2" rx="12" ry="10" fill="#ffffff"/>
      <ellipse cx="0" cy="4" rx="20" ry="6" fill="#ffffff"/>
    </g>
  </defs>
  <use href="#cloud" x="60" y="40"/>
  <use href="#cloud" transform="translate(205 88) scale(0.7)"/>
  <use href="#cloud" transform="translate(320 30) scale(1.2)"/>
  <use href="#cloud" transform="translate(140 150) scale(0.5)"/>
</svg>
