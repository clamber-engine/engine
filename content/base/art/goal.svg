<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- The goal: a stone summit gate with a glowing heart. 32x64 frames;
       the middle of its base is the origin (16, 64). Two frames pulse. -->
  <defs>
    <g id="gate">
      <path d="M1 64 L1 20 A15 15 0 0 1 31 20 L31 64 Z" fill="#1d1a2b"/>
      <path d="M2 63 L2 20 A14 14 0 0 1 30 20 L30 63 Z" fill="#8d8a9b"/>
      <path d="M7 64 L7 22 A9 9 0 0 1 25 22 L25 64 Z" fill="#1d1a2b"/>
      <rect x="2" y="30" width="5" height="1" fill="#6c6979"/>
      <rect x="25" y="40" width="5" height="1" fill="#6c6979"/>
      <rect x="2" y="50" width="5" height="1" fill="#6c6979"/>
      <rect x="25" y="26" width="5" height="1" fill="#6c6979"/>
      <rect x="0" y="60" width="32" height="4" fill="#1d1a2b"/>
      <rect x="1" y="61" width="30" height="2" fill="#6c6979"/>
    </g>
  </defs>

  <use href="#gate"/>
  <path d="M8 63 L8 22 A8 8 0 0 1 24 22 L24 63 Z" fill="#ffd23f"/>
  <path d="M11 63 L11 24 A5 5 0 0 1 21 24 L21 63 Z" fill="#ffe9a8"/>
  <path d="M16 6 L18 10 L16 14 L14 10 Z" fill="#3ee0b0" stroke="#1d1a2b" stroke-width="1"/>

  <g transform="translate(32 0)">
    <use href="#gate"/>
    <path d="M8 63 L8 22 A8 8 0 0 1 24 22 L24 63 Z" fill="#ffe9a8"/>
    <path d="M12 63 L12 25 A4 4 0 0 1 20 25 L20 63 Z" fill="#ffffff"/>
    <path d="M16 5 L18.5 10 L16 15 L13.5 10 Z" fill="#b8f5e3" stroke="#1d1a2b" stroke-width="1"/>
  </g>
</svg>
