<svg xmlns="http://www.w3.org/2000/svg" width="96" height="32" viewBox="0 0 96 32" shape-rendering="crispEdges">
  <!-- The launcher: a barrel that fires the player out of its mouth.
       Points right; rotate it for other directions. 32x32 frames with
       the origin in the middle (16, 16). 0: waiting. 1-2: firing. -->
  <defs>
    <g id="barrel">
      <rect x="3" y="7" width="22" height="18" rx="4" fill="#1d1a2b"/>
      <rect x="4" y="8" width="20" height="16" rx="3" fill="#c08a52"/>
      <rect x="8" y="8" width="2" height="16" fill="#7a5230"/>
      <rect x="17" y="8" width="2" height="16" fill="#7a5230"/>
      <rect x="23" y="5" width="7" height="22" rx="2" fill="#1d1a2b"/>
      <rect x="24" y="6" width="5" height="20" rx="1" fill="#9aa0a6"/>
      <rect x="27" y="10" width="2" height="12" fill="#1d1a2b"/>
    </g>
    <path id="puff" d="M0 -3 A3 3 0 0 1 3 0 A3 3 0 0 1 0 3 A3 3 0 0 1 -3 0 A3 3 0 0 1 0 -3 Z" fill="#f2e8cf"/>
  </defs>

  <use href="#barrel"/>

  <!-- 1 recoil, flash at the mouth -->
  <g transform="translate(32 0)">
    <use href="#barrel" x="-2"/>
    <path d="M28 9 L32 16 L28 23 Z" fill="#ffd23f"/>
  </g>
  <!-- 2 smoke -->
  <g transform="translate(64 0)">
    <use href="#barrel" x="-1"/>
    <use href="#puff" x="29" y="12"/>
    <use href="#puff" x="29" y="20"/>
  </g>
</svg>
