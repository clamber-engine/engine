<svg xmlns="http://www.w3.org/2000/svg" width="72" height="24" viewBox="0 0 72 24" shape-rendering="crispEdges">
  <!-- The crawler: a pebble mite that walks back and forth. Faces right.
       24x24 frames; feet at the bottom centre (12, 24). -->
  <defs>
    <g id="shell">
      <path d="M2 20 A10 10 0 0 1 22 20 Z" fill="#1d1a2b"/>
      <path d="M3 19 A9 9 0 0 1 21 19 Z" fill="#7b5ea7"/>
      <circle cx="8" cy="14" r="2" fill="#a58ccf"/>
      <circle cx="12" cy="11.5" r="1.5" fill="#a58ccf"/>
      <rect x="3" y="18" width="18" height="4" rx="2" fill="#1d1a2b"/>
      <rect x="4" y="19" width="16" height="2" fill="#d9c9a3"/>
      <ellipse cx="17" cy="15" rx="2.5" ry="2.5" fill="#ffffff"/>
      <rect x="18" y="14" width="1" height="2" fill="#1d1a2b"/>
      <path d="M14 11 L19 12 L19 13 L14 12 Z" fill="#1d1a2b"/>
    </g>
    <rect id="leg" width="2" height="4" fill="#1d1a2b"/>
  </defs>

  <!-- 0-1 walk -->
  <g>
    <use href="#shell"/>
    <use href="#leg" x="5" y="21"/>
    <use href="#leg" x="11" y="20"/>
    <use href="#leg" x="17" y="21"/>
  </g>
  <g transform="translate(24 0)">
    <use href="#shell" y="-1"/>
    <use href="#leg" x="6" y="20"/>
    <use href="#leg" x="11" y="21"/>
    <use href="#leg" x="16" y="20"/>
  </g>

  <!-- 2 defeated: flattened -->
  <g transform="translate(48 0)">
    <ellipse cx="12" cy="21" rx="11" ry="3" fill="#1d1a2b"/>
    <ellipse cx="12" cy="21" rx="10" ry="2" fill="#7b5ea7"/>
    <path d="M15 19 L19 23 M19 19 L15 23" stroke="#ffffff" stroke-width="1"/>
  </g>
</svg>
