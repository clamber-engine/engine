life_item_lives_step = 44
life_item_lives_every = 16
life_item_lives_out = 122
# The taken figure's image (figure.md): its 34 px box flies from where
# the figure was to (74, 2), covering about an eighth of the distance
# left each frame, rests there for 63 frames, then rises 4 px a frame.
