# When an area begins (view.md): the view starts 79 left of the lead,
# plus 1/2; in the entrance it aims 79 behind the lead, and after the
# throw 127 behind, following quickly from 5 frames after the throw
# until the lead lands.
view_begin_back = 79
view_begin_back_far = 127
view_begin_far = 5
view_fast_speed_share = 2
# The level's left and right ends (level-ends.md): the picture's left edge
# is kept inside the level's camera limits, and the player is stopped 18
# inside the range the picture can show.
end_stop = 18
# The view's vertical motion (view-vertical.md). The picture is 224 tall.
# The level's vertical limits and rates are its camera rules' `limits`
# and `quick`.
view_height = 224
view_feet = 160
view_feet_top = 47
view_band = 32
view_reach = 2
view_share_y = 64
view_speed_share_y = 16
view_share_y_quick = 16
view_speed_share_y_quick = 8
view_quick_below = 208
view_quick_fall_below = 64
view_quick_fall = 6
view_slack_y = 0.125
# The view's shake during the ground action (view-vertical.md). The spec
# puts the first shake 25 to 28 frames after the press without saying
# which; 26 is the engine's choice.
view_shake_count = 22
view_shake_delay = 26
view_shake_period = 4
view_shake_size = 4
appear_left = 31
appear_right = 32
# A placed thing that needs the view's rows too, and a point where two
# sections meet, are near the view from 31 above it to 32 below it
# (placements.md, "When placed objects appear").
appear_above = 31
appear_below = 32
remove_left = 128
remove_right = 129
# Passing the end marker, the walk-out and the fade (level-end.md). The
# brightness goes from 15 to 0 a step every 2 frames, so the picture is
# black 28 frames after the fade starts.
end_reach = 4
end_walk_speed = 2
end_rise = 0.125
end_fade_at = 240
end_fade_time = 28
end_fade_step = 2
# An object still in the lead's hands is let go on the walk-out's first
# frame (level-end.md, "An object in the lead's hands"). Besides the
# knock-out's edges, it's removed 289 or more right of the view's left
# edge or 33 or more above its top.
end_let_go_right = 289
end_let_go_above = 33
# An end marker leading back to the level, as in the first level's room
# (level-end.md, "In the first level's room"): the walk-out's first frame
# doesn't count for the fade's start, and the picture stays black one
# frame more.
end_onward_fade_from = 1
end_onward_hold = 1
# Exits (exits.md): an exit takes over a lead on the ground, not moving
# right, from 39 above it to 35 below it, within a reach that depends on
# its state and facing. The lead walks left 2 px a frame; once it is 4 px
# left of the exit the view stops and the picture fades from 15 to 0 a
# step every 2 frames, and the area's last frame is 30 after that one.
exit_walk_speed = 2
exit_reach = 31
exit_reach_roll = 29
exit_reach_crouch = 34
exit_reach_right = 37
# Wall exits (wall-exits.md) lead right, with every reach 2 px shorter
# than an exit's turned around, and a crouching lead in reach whether it
# still slides or not; the rest is as for exits.
wall_exit_reach = 29
wall_exit_reach_roll = 27
wall_exit_reach_crouch = 32
wall_exit_reach_left = 35
exit_above = 39
exit_below = 35
exit_leave_at = 4
exit_fade_time = 30
exit_fade_step = 2
# Walking into an area (exits.md, "Walking in"): the lead starts 80
# behind the point and walks 3 a frame, its last step on frame 27 to 4
# past it, with the other character 28 behind; the player has control
# from frame 28 at 3 a frame. The picture fades in a step every 3 frames
# over 15 steps.
walk_in_speed = 3
walk_in_back = 80
walk_in_time = 27
walk_in_ahead = 4
walk_in_other = 28
walk_in_fade_step = 3
walk_in_fade_steps = 15
# Falling out of the level (falling-out.md): the life is lost once the
# feet are more than 48 px below the level's bottom, and the level's last
# frame is 96 frames after that one.
fall_out_depth = 48
fall_out_time = 96
# What is there again after a knock-out (restart-barrel.md): the level's
# things as at its start, but the restart barrel once broken and, coming
# back at the restart point, the letters taken.
resume_afresh = 1
# The dimming near the first level's end (dimming.md): 32 steps 8 frames
# apart, the first on a frame at least 4 after the dim entry comes into
# the window. The spec doesn't say where the 8-frame cycle sits; the
# engine puts steps on frames whose number is a multiple of 8.
dim_steps = 32
dim_step_time = 8
dim_delay = 4
# Swimming (swimming.md): targets of 2 approached by 1/32 of the gap,
# strokes of 2 (2.5 with Up, 1 with Down), sinking by 12/256 up to 1.25
# (2 with Down). Ground 1 to 3 px deep across a move is a step up, or a
# push down to 2 px below a ceiling line (1 px between the ceiling and
# the feet's top); deeper is a wall. The left end stops a swimmer below
# x = 18, and leaving the floor without a stroke ends at 1/256.
swim_speed = 2
swim_response = 0.03125
stroke_speed = 2
stroke_up_speed = 2.5
stroke_down_speed = 1
sink_gravity = 0.046875
sink_speed = 1.25
sink_down_speed = 2
swim_step = 3
swim_ceiling_gap = 1
swim_left_edge = 18
swim_leave_speed = 0.00390625

# The second character (roster slot 1): spec/behavior/second-character.md.
# It moves by the same rules with its own speeds, jump and crouch
# recovery; `jump_release_speed` stays equal to `jump_speed`, as above.
# Swapping with it as the player (swap.md) waits less, the first
# character follows a frame behind, a jump press just before doesn't
# shorten the wait, and the crouch windows differ.
# Its rolls (second-character.md, "Rolls") are shorter, with larger
# sizes, but a slow roll steered its way goes toward the first
# character's 3. Carrying on lasts to D + 6. A single running frame from
# standing doesn't make a neutral roll fast even with a direction held
# after it; a new press on the stop's last frame lengthens that roll as a
# remembered one does; and facing turns at once all through the stop.
# Down + Action rolls, as `ground_action_time` is 0.
[presets.classic-1.roster.1]
walk_speed = 2.25
top_speed = 3.375
jump_speed = 8.3515625
jump_release_speed = 8.3515625
held_jump_gravity = 0.3515625
crouch_recovery = 13
swap_wait = 39
swap_jump_wait = 0
swap_lag = 1
swap_crouch_wait = 21
swap_rise_wait = 12
roll_time = 24
roll_slow_speed = 1.125
roll_speed = 3.375
roll_fast_speed = 4.5
roll_steer_speed = 3
roll_carry_time = 6
roll_lone_run_any_dir = 1
roll_stop_press_lengthens = 1
roll_slide_turns = 1
# The second character follows by where the first is now.
follow_lag = 0
# The second character being hit isn't specified yet, so it's a hit with
# one character, as before.
lose_jump = 0
ground_action_time = 0

# Classic 2: the `title-2` values. Filled in so far: jump input timing
# (jump-input.md and walk-off.md, "In `title-2`"), crouching on the
# ground (ground-speed.md, "Crouching (`title-2`)"), the vertical part of
# the jump arc (jump-arc.md, "In `title-2`") and falls off a ledge
# (walk-off.md, "In `title-2`"). A jump starts on a press held on that
# frame, up to 15 frames after it, and takes off two frames later, still
# on the ground; a jump can start on the frame after a jump's landing, or
# on the second frame after a walk-off fall's landing, and on the leave
# frame and the one after it. A crouch starts on Down without Up, goes on
# while exactly one of them is held, stops the player on the frame it
# ends too, and keeps turns from starting for 11 frames from then; a jump
# started in it doesn't take off if it ends first. A jump rises at
# 8.21875 under the lighter gravity while held, until the top. Walking
# off a ledge drops 3.4375 px, then falls from 1.4375 px per frame, or
# from 1/256 while crouching, which goes on in the air; facing stays for
# the first two frames. Horizontal speed (ground-speed.md and
# air-control.md, "In `title-2`") eases an eighth of the way to 2.25, or
# 3.375 if Action was held with a direction on the frame before, on the
# ground and in the air alike; facing doesn't change while a jump waits
# to take off, and follows the input at once in the air. On the ground
# a turn starts at once and lasts 8 frames, facing changing on its fifth,
# or 7 frames if the player moves toward the new facing at 797/256 or
# faster on its second. An Action press on the ground without Down starts
# a 31-frame roll (roll-input.md and roll-speed.md, "In `title-2`") that
# eases toward 1.125 with no direction held, 4.5 after a hold of Action of
# 32 frames or more that ended within 19 frames, or 3.375; the other way
# turns it at once. With Action held all through, it carries on into
# running; otherwise the player stands for 14 frames, and a press held
# into the end of that stop, or into a landing, starts the next roll if
# made within 11 frames of it. A roll off a ledge (rolling-off-ledges.md,
# "In `title-2`") keeps its speed rule in the air and falls without the
# step to 1.4375, hanging still from its second airborne frame to 12
# frames after the press if it left within 10; in the air at the end of
# its frame S + 28 (and every 28 frames after) it lasts 28 frames more.
# It can end in the air: a stop falls straight down for 14 frames, then
# steps to 1.4375; a carry-on steps on the next frame. A jump can start
# on any roll frame in the air, under the lighter gravity until take-off,
# during a stop in the air, and on the frame after either ends. On a steep
# face (steep-faces.md, "In `title-2`") the frame after one that started
# on it eases toward a target 1 px per frame further downhill; a frame
# that starts on it limits the speed downhill to 0.75 to 2.25 (above,
# 2), faces downhill, and leaves the ground 8 px down, with no step,
# when the floor ahead is more than 8 px lower. Elsewhere the ground is
# followed only 3 px down. Bounces off walkers (bounce.md, "In
# `title-2`") leave at 8.21875 after the frame's move, then the player
# and every walker hold still for 2 frames; the walker bounced on
# doesn't move on the bounce's frame either. Walkers with a `contact`
# table (walker-contact.md, "In `title-2`") read the player's stance:
# standing at 0.125 px per frame or slower and running above 2.5 are
# the engine's choices, inside the frames the spec saw the switches on.
# Hurt alone (knock-out.md, "In `title-2`"), the player moves as usual on
# the hit frame, then leaves at 5.5 up and 1 back, facing the other way,
# under gravity 0.234375 up to 8; the game pauses 6 frames after H + 1,
# and walkers hold still on H + 1 and catch up. Landing, it slides on;
# from H + 48, on the ground, it hops at 2.5 and slows by an eighth each
# frame, and it's gone after H + 189 or P + 140, whichever is later.
# The spec only saw walkers heading left knock the player left; going
# with the walker's heading is the engine's choice. Rolling into walkers
# (rolling-into-walkers.md, "In `title-2`"): a walker whose contact
# table has a `roll` range is defeated on any roll frame, and hurts in
# the stop after one, by that range. The walker doesn't move on the
# defeat's frame, and the player and every walker hold still for 2
# frames after it. With Action held on the defeat's frame, the roll eases
# toward 1 px per frame more for 31 new frames, then carries on into
# running; otherwise it goes on where it was.
[presets.classic-2]
label = "Classic 2"
description = "Placeholder: plays like Default until measured values are available."
placeholder = true
title = "title-2"

