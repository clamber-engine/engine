# Clamber's built-in feel presets.
#
# A preset adjusts world physics (`world`) and, optionally, the character in
# a given roster slot (`roster.<slot>`, which may also adjust ability
# parameters under `abilities.<name>`). Values are plain numbers, or
# `{ scale = <factor> }` to multiply what the base preset gives.
#
# Units: pixels and frames at 60 Hz. Speeds are px/frame, accelerations
# px/frame², and +y points down. `jump_buffer` and `coyote_time` are whole
# frames.
#
# `default` is the root every other preset builds on, so it sets every
# movement parameter. These are Clamber's own values, chosen for feel:
# heavy and quick, with falls faster than climbs (`fall_gravity` above
# `gravity`) so there's little hang at the top of a jump.

[presets.default]
label = "Default"
description = "Clamber's standard feel."

[presets.default.world]
gravity = 0.375
fall_gravity = 0.5625
max_fall_speed = 15
ground_acceleration = 0.1875
ground_deceleration = 0.5
ground_friction = 0.1875
top_speed = 5
walk_speed = 2.5
air_acceleration = 0.125
speed_response = 0
jump_speed = 7.5
jump_release_speed = 3
jump_buffer = 5
coyote_time = 5
roll_friction = 0.03125
roll_deceleration = 0.125
roll_min_speed = 0.75
bounce_speed = 6

[presets.snappy]
label = "Snappy"
description = "Quicker starts and stops, heavier and shorter jumps."

[presets.snappy.world]
gravity = 0.5
fall_gravity = 0.75
jump_speed = 8
ground_acceleration = 0.25
ground_deceleration = 0.75
ground_friction = 0.25
air_acceleration = 0.15625

[presets.floaty]
label = "Floaty"
description = "Light gravity, slow falls and long, steerable jumps."

[presets.floaty.world]
gravity = 0.15625
fall_gravity = 0.15625
max_fall_speed = 8
jump_speed = 5
jump_release_speed = 2.5
air_acceleration = 0.09375

# The Classic presets are filled in from measured values in
# `spec/behavior/`. Until all of a preset's values are in, it is marked
# as a placeholder, and what isn't filled in yet plays like Default.
# Don't put values here that don't come from `spec`.

# Classic 1: the `title-1` values. Filled in so far: horizontal speed
# (ground-speed.md, air-control.md).
[presets.classic-1]
label = "Classic 1"
description = "Placeholder: partly measured; the rest plays like Default."
placeholder = true

[presets.classic-1.world]
walk_speed = 2
top_speed = 3
speed_response = 0.125

[presets.classic-2]
label = "Classic 2"
description = "Placeholder: plays like Default until measured values are available."
placeholder = true

[presets.classic-3]
label = "Classic 3"
description = "Placeholder: plays like Default until measured values are available."
placeholder = true
