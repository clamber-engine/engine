# The Classic presets are filled in from measured values in
# `spec/behavior/`. Until a preset's core movement is in, it is marked
# as a placeholder, and what isn't filled in yet plays like Default.
# Don't put values here that don't come from `spec`. `title` names the
# title (`spec/TITLES.md`) whose measured values a preset holds; traces
# recorded on it say so in their `# title:` line.

# Classic 1: the `title-1` values. Filled in so far: horizontal speed,
# crouching and turns (ground-speed.md, air-control.md), jump input
# timing (jump-input.md, walk-off.md), the jump arc and landing
# (jump-arc.md, landing.md), walking off ledges (walk-off.md), rolls
# (roll-input.md, roll-speed.md, rolling-off-ledges.md), bounces off
# walkers and getting hurt by them (bounce.md, walker-contact.md),
# knock-out (knock-out.md), steep faces on the ground (steep-faces.md),
# rolling into walkers (rolling-into-walkers.md), walls in the air
# (air-walls.md), when a turn starts while moving: the stride cycle
# (ground-speed.md, "Standing, walking and running"), and swapping
# places with the other character (swap.md), losing a character and
# protection (losing-a-character.md, protection.md), the other
# character following (following.md), carrying
# objects (carrying.md), the collectible count (collectibles.md;
# the collectibles are archetypes.toml's `spark` and `cluster`), the
# view and walkers appearing with it (view.md, view-vertical.md,
# walker-view.md), the ground action (ground-action.md), and finishing a
# level at its end marker (level-end.md). Classic 1
# is the bundled game's starting preset. Jump doesn't cut upward speed
# when let go (`jump_release_speed` equals `jump_speed`); it ends the
# lighter `held_jump_gravity` instead.
#
# The bounce box is one way to split walker-contact.md's bounce ranges
# between the player and a walker: it gives exactly those ranges against
# a walker with `size = [20, 12]` and `offset = 0.5` (the small walker)
# or `size = [26, 38]` and `offset = 0.5` (the large one). The hurt box
# (24 wide, 3 behind) splits walker-contact.md's hurt ranges the same
# way; lifting its bottom 21 px from 6 frames into a jump gives the
# vertical reach there. The roll's attack box (22 wide, 4 behind),
# checked against walkers before they move as the bounce box is, gives
# rolling-into-walkers.md's defeat ranges at the end of the frame for
# walkers walking at full speed. The ground action's attack box (53 wide,
# its middle 26.5 ahead), checked the same way, gives
# ground-action-enemies.md's knock-out ranges at the end of the frame for
# walkers walking at full speed. The knock-out flight falls under `gravity`,
# which is knock-out.md's 0.4375 here.
