relic_size = 34
relic_x = 74
relic_y = 2
relic_rest = 63
relic_rise = 4
# The view (view.md) and walkers appearing and being removed with it
# (walker-view.md). The picture is 256 wide; the window for a walker's
# start runs from 31 left of it to 32 right of it, and a walker is
# removed 128 left of it or 129 right of it.
