# Built-in entity archetypes. An entity's `type` in a level names one of
# these, and the archetype says how it behaves. An entity can change any
# value but `behavior` under its own `params`.
#
# Every archetype has a `behavior`, which the engine implements, and a
# `size = [w, h]`: the box it touches the player with. A walker stands on
# its position; anything else is centred on it. `offset` moves the box's
# middle that far in front of the position, the way it's going (negative:
# behind).
#
# Behaviors and their values:
#
# - `walker`: an enemy that walks along the ground at `speed` and turns
#   at walls and ledges. It starts walking the way `facing` says
#   (`"left"` or `"right"`), at full speed. Above 0, `response` (up to 1)
#   is the part of the gap to its speed it closes each frame, rounded as
#   the player's `speed_response` is, so it eases into a turn. 0 changes
#   speed at once. A walker that would walk into a wall is put against
#   it with no speed, and one that would walk off a ledge stops where it
#   is; either way it heads back from the next frame. With
#   `range = [left, right]`, offsets from where it's placed, it also
#   turns once its x rounded down is past an end, the way it's heading,
#   without stopping (`range = []`: no range). Its facing, which it's
#   drawn with, follows a turn `turn_delay` frames later (one more after
#   stopping at a wall or ledge). Defeated, it jumps up at `defeat_jump`
#   and falls through the floor under `defeat_gravity`, up to
#   `defeat_max_fall`, keeping the speed it had; it's gone once below the
#   level. After a bounce it holds still first for the bounce's frozen
#   frames, as the player does. With a preset that has a view
#   (`view_width` above 0), a walker is in the level only near the view;
#   when it appears there, it waits `appear_wait` frames, counting the one
#   it appears on, before it moves (0: it moves on that frame).
# - `patrol`: an enemy that flies from where it's placed to `path = [x, y]`
#   away and back, taking `period` frames for the round trip.
# - `launcher`: fires the player off at `velocity = [x, y]` on touch.
# - `carry`: an object the player can pick up, carry, throw and put down,
#   with physics that has `pick_up_time` above 0. It stands on its
#   position. The player reaches it with its x within `reach` of the
#   player's and its bottom within 8 px of the player's feet. Thrown,
#   it flies until it first touches something: a wall, and it drops
#   straight down; the floor, and it rests there. It doesn't touch
#   characters yet.
# - `collect`: a collectible the player takes by reaching it. It's then
#   gone, and adds `worth` to the collectible count, one at a time: the
#   first as it's taken, then one every `release_every` frames, each
#   arriving `count_delay` frames after that. Its position is its middle.
#   `reach` is one table, or two: the first character's, then the one
#   for any other (left out: the first's). Each says where the player
#   takes it from, as `[past from, to, below from, to]`, whole px, ends
#   included: how far the player's x, rounded down, is past the
#   collectible's the way the player faces, and how far the player's
#   feet, rounded up, are below it. Which applies depends on what the
#   player is doing at the end of a frame: `stand`, `walk` (walking or
#   running), `crouch` (down held on the ground), `roll`, `jump` (for the
#   first `jump_early` frames of a jump, counting the one it starts on),
#   and `air` (the rest of a jump, or in the air another way, and for the
#   first `land_hold` frames after landing, counting the landing). In the
#   air after `jump`, `air_below = [[vy, below], ...]` lifts the lowest
#   `below`: the first pair whose `vy` is at least the player's vertical
#   speed gives it, past them all it's `air`'s. Only the character under
#   control takes collectibles.
#
# The player defeats an enemy by landing on it, and bounces off, or by
# rolling into it. Touching one any other way costs a life.
#
# Units: px and frames at 60 Hz, +y down. Speeds are px/frame. These are
# Clamber's own values, except where a comment says otherwise.

[archetypes.crawler]
behavior = "walker"
size = [20, 18]
offset = 0
speed = 0.5
response = 0
facing = "left"
turn_delay = 0
appear_wait = 0
range = []
defeat_jump = 5
defeat_gravity = 0.375
defeat_max_fall = 8

[archetypes.flutter]
behavior = "patrol"
size = [18, 16]
offset = 0
path = [0, -64]
period = 180

[archetypes.launcher]
behavior = "launcher"
size = [24, 16]
offset = 0
velocity = [0, -13.5]

# `reach` is a placeholder: spec/behavior/carrying.md doesn't give the
# reach for Classic 1 yet (clamber-engine/spec#19). 24 is the player's
# half width and this box's added together, so the boxes touch.
[archetypes.crate]
behavior = "carry"
size = [32, 24]
offset = 0
reach = 24

# Collectibles with title-1's measured values. `spark`: a single
# collectible (spec/behavior/collectibles.md), drawn 16 x 16 around its
# position. `cluster`: a bunch worth ten (spec/behavior/bunches.md). The
# spec doesn't cover a bunch taken by the second character, so it uses
# the first's reach. Not in yet: the view window, and the count delays
# that depend on where the view is (#98); until then the view is taken
# to have the collectible well inside it. Where the spec doesn't cover
# what the player is doing (bouncing, falling without a jump, carried
# down a face, landing while moving, and so on), the reach is the one
# for the nearest pose above.
[archetypes.spark]
behavior = "collect"
size = [16, 16]
offset = 0
worth = 1
release_every = 0
count_delay = 33

[[archetypes.spark.reach]]
stand = [-16, 22, -7, 41]
walk = [-16, 22, -7, 41]
crouch = [-19, 13, -11, 32]
roll = [-14, 22, -3, 39]
jump = [-16, 22, -7, 41]
air = [-16, 19, 16, 58]
air_below = [[-4.5, 20], [-3.5, 21], [-2.5, 22], [0, 14]]
jump_early = 7
land_hold = 7

[[archetypes.spark.reach]]
stand = [-13, 12, -9, 39]
walk = [-19, 13, -5, 39]
crouch = [-20, 15, -8, 16]
roll = [-19, 13, -5, 39]
jump = [-19, 13, -5, 39]
air = [-19, 13, -5, 39]
air_below = []
jump_early = 0
land_hold = 0

[archetypes.cluster]
behavior = "collect"
size = [24, 24]
offset = 0
worth = 10
release_every = 6
count_delay = 17

[[archetypes.cluster.reach]]
stand = [-15, 21, -8, 40]
walk = [-15, 21, -8, 40]
crouch = [-18, 12, -12, 31]
roll = [-13, 21, -4, 38]
jump = [-15, 21, -8, 40]
air = [-15, 18, 13, 57]
air_below = []
jump_early = 6
land_hold = 4
