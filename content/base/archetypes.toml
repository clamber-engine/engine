# Built-in entity archetypes. An entity's `type` in a level names one of
# these, and the archetype says how it behaves. An entity can change any
# value but `behavior` under its own `params`.
#
# Every archetype has a `behavior`, which the engine implements, and a
# `size = [w, h]`: the box it touches the player with. A walker stands on
# its position; anything else is centred on it. `offset` moves the box's
# middle that far in front of the position, the way it's going (negative:
# behind).
#
# Behaviors and their values:
#
# - `walker`: an enemy that walks along the ground at `speed` and turns
#   at walls and ledges. It starts walking the way `facing` says
#   (`"left"` or `"right"`), at full speed. Above 0, `response` (up to 1)
#   is the part of the gap to its speed it closes each frame, rounded as
#   the player's `speed_response` is, so it eases into a turn. 0 changes
#   speed at once. `response` can also be a list of two parts adding up
#   to no more than 1, each rounded on its own and then added; when that
#   comes to nothing, the speed becomes the target. With
#   `move_first = true` (left out: false), it moves by the speed it had
#   before each frame's change, walking and falling once defeated. With
#   `columns = true` (left out: false), it stands on the floor of the
#   1-px column holding its x, as a player does with `face_slope`. A walker that would walk into a wall is put against
#   it with no speed, and one that would walk off a ledge stops where it
#   is; either way it heads back from the next frame. With
#   `stops_at_x = true` (left out: false), it's its x rather than the
#   front of its box that meets walls and ledges: a wall stops it with
#   its x at the wall, and it walks on until its x would leave the floor. With
#   `drop = { leave, leave_speed, gravity, max_fall, land }`, it walks
#   off ledges instead of stopping at them, going on across in the air
#   as on the floor: on the frame its x leaves the floor (no floor
#   within a step below), or the second frame in a row in the lowest
#   column of a steep face with no such floor on the way it heads, it
#   moves `leave` down, with `leave_speed` as its speed down. One placed
#   above the floor starts in the air with none. In the air its speed
#   down grows by `gravity` each frame, up to `max_fall`, and it moves
#   down by it; it lands on the floor of the column holding its x, of
#   the floor not above its feet before the move, once it's less than
#   `land` above it or below it. Below the level it's gone for good. With
#   `range = [left, right]`, offsets from where it's placed, it also
#   turns once its x rounded down is past an end, the way it's heading,
#   without stopping (`range = []`: no range). Its facing, which it's
#   drawn with, follows a turn `turn_delay` frames later (one more after
#   stopping at a wall or ledge). Defeated, it jumps up at `defeat_jump`
#   and falls through the floor under `defeat_gravity`, up to
#   `defeat_max_fall`, keeping the speed it had; it's gone once below the
#   level. After a bounce it holds still first for the bounce's frozen
#   frames, as the player does. With `bounced_speed` (left out: it keeps
#   its speed), bounced on, it moves at that speed away from the way the
#   player faces, and faces that way. With `heavy = true`, a player
#   whose preset has a `bounce_back_rise` doesn't bounce on it: it's
#   thrown back and the walker is pushed (neither is defeated). With `hurt_jump_lift` (left out:
#   the preset's), the preset's hurt box rises that far above the feet
#   against it when the airborne pose lifts it. With `thrown_lower =
#   [early, late]`, a thrown object hits it only down to that many px
#   below its feet, early on (its `hit_early_time`) and later; without
#   it the object's `hit` box limits that. Hit by a thrown object, it's knocked
#   back the way the object came at `defeat_knock`, its speed easing
#   toward `defeat_knock_glide` in that direction, as it moves by
#   `response`: on the next frame along the floor, then jumping up at
#   `defeat_jump` and falling as above. With a preset that has a view
#   (`view_width` above 0), a walker is in the level only near the view;
#   when it appears there, it waits `appear_wait` frames, counting the one
#   it appears on, before it moves (0: it moves on that frame). Walkers
#   given the same `group` above 0 appear together, as soon as any of
#   their starts is near the view, and are removed together, once all of
#   them would be (`group = 0`: on its own). With a `contact` table, it
#   touches the player when the player's offsets from it are within the
#   ranges for the player's stance: `[across from, to, above from, to]`,
#   whole px, ends included, where `across` is the player's x less the
#   walker's and `above` the walker's y less the player's, all rounded
#   down, with the player where it is after its move on a frame and the
#   walker where it was before its own. The ranges are for facing right;
#   facing left, `across` turns around to from `turn` less its end to
#   `turn` less its start. The stances: `air` (in the air, from the frame
#   a jump starts on, and after landing up to `land_hold = [frames,
#   running]` frames after the landing frame, `running` when Action and a
#   direction were held on it), `crouch` (crouching, and while no turn can
#   start after a crouch), `run` and `walk` (on the ground, faster than
#   the preset's `stance_run_speed` and `stance_stand_speed`), and
#   `stand`. A player on the ground that it touches is hurt; one in the
#   air bounces off it if it rises at `bounce_rise` or slower and `above`
#   is `bounce_above` or more, and is hurt otherwise. With a `roll`
#   range, a player on a frame of a timed roll within it defeats it, and
#   one in the stop after a timed roll within it is hurt; without one, it
#   doesn't touch the player then. The preset's bounce and hurt boxes
#   don't apply to it. A player riding an animal meets it only as its
#   `rider` table says, by offsets in whole px: `across`, the rider's x
#   less the walker's, rounded down, and `above`, how far the rider is
#   above the walker, rounded toward the floor. `attack_across` and
#   `knock_across` are `[[from, to], [from, to]]`, ends included, for a
#   rider facing right and the walker facing the same way, then the
#   other way; for a rider facing left, the range for how the walker
#   faces turns around (from minus its end to minus its start). Within
#   `attack_across` and up to `attack_above`, with the rider after its
#   move on a frame and the walker before its own, the walker is in
#   front of the animal: it starts a charge, or is thrown by one (the
#   ride's `throw_*` values), its speed across becoming `throw_speed`
#   times the rider's. On the rider's floor, within `knock_across` at
#   the end of a frame, it knocks the rider off on the next one if the
#   rider was on the floor at the end of that frame and the one before,
#   or is no more than `knock_above` above it.
# - `patrol`: an enemy that flies from where it's placed to `path = [x, y]`
#   away and back, taking `period` frames for the round trip.
# - `launcher`: fires the player off at `velocity = [x, y]` on touch.
# - `carry`: an object the player can pick up, carry, throw and put down,
#   with physics that has `pick_up_time` above 0. It stands on its
#   position. The player picks it up from within `reach = { right =
#   [from, to], left = [from, to], below = [from, to] }`: its x rounded
#   down less the player's, by the way the player faces, and its y
#   rounded up less the player's feet line, px, ends included. Thrown,
#   it bounces and rolls on the floor and breaks against faces and
#   walls (the preset's `throw_*` values), and hits walkers: those whose
#   box overlaps `hit = [behind, ahead, above, below]`, px from its
#   position with x rounded down, behind and ahead of it the way it
#   moves, or `hit_early` for its first `hit_early_time` frames out of
#   the hands. It knocks out a thrower whose position, both rounded down
#   across and up down, is inside `hit_thrower`, `[behind, ahead, above,
#   below]` from its own, ends included, or `hit_thrower_early` early on;
#   moving left, both are turned around and moved `hit_thrower_turn` px
#   (default 0) to the left. Thrown, it goes on as it was. In the hands
#   on the frames of a throw before it leaves them, but not the first,
#   by `hit_thrower_early`, and carried, by `hit_thrower`, the way the
#   player faces, it breaks there; carried, the player then carries
#   nothing. With `hit_carried_turn`, carried (after the frame the
#   carrying starts) it also breaks on a walker its `hit` box touches as
#   if moving right, the box moved `hit_carried_turn` px right with the
#   player facing left, and knocks the walker back as a thrown one
#   moving right does; not on a frame the player bounces. So it does on
#   a pick-up's frames after its first and a put-down's before it's set
#   down, and during a throw, after its first frame and before it leaves
#   the hands, on walkers its `hit_early` box touches the way the player
#   faces, knocking them back the same way; the action goes on to its
#   end without it. Where it is in the hands: `in_hands_pick_up` from a
#   pick-up's second frame (on its first it's where it lies), and
#   `in_hands_throw` and `in_hands_put_down` from their first, each
#   `[[ahead, up], ...]`, one a frame, up to 24: its x rounded down that
#   many px in front of the player's the way it faces, and its y rounded
#   up that many above the player's. Past their end, or without them,
#   it's on the player's head. With `meets_ball` and `meets_ball_early`, `[behind, ahead,
#   above, below]` as for the thrower, chosen the same way, it meets a
#   ball whose position at the end of the frame before, both rounded down
#   across and up down, is inside: thrown, it removes the ball and goes
#   on as it was; in the hands it breaks as on a thrower. Moving left,
#   the boxes are turned around and moved `meets_ball_turn` px (default
#   0) to the left, and in the nth part of the ball's turn (the ball's
#   `contact.turn`) moved by the nth of `meets_ball_parts = [[across,
#   above], ...]`, px left and down. One holding the character doesn't
#   use them. It doesn't touch characters yet. With
#   `holds_character = true`, it holds the character missing from the
#   level (while the roster has another character and characters swap
#   places), and it frees it when it breaks: the character flies to the
#   player and joins it (the preset's `join_*` values), while the player,
#   walkers and throwers hold still. Thrown, it breaks where one holding
#   nothing would break or hit a walker, and also instead of bouncing,
#   at once against a wall (still falling in its own column that frame),
#   outside `holder_window` around the picture (as for a `ball`, with
#   the view where it was at the start of the frame; without a view,
#   below the level), and on a thrower its thrower boxes hold, and a
#   ball inside `hit_ball` or `hit_ball_early` early on, as for the
#   thrower. A thrower it breaks on is knocked out, and a ball is gone.
#   In the hands it doesn't break on throwers. On the
#   frames of a throw before it leaves the hands, but not the first, it
#   breaks on walkers its `hit_early` box touches in the hands, and
#   carried, with a `hit_carried_turn`, on walkers as one holding nothing
#   does, on a pick-up's and a put-down's frames too; the walker then
#   doesn't hurt the player until the character has joined. Put down,
#   lying or dropped, it doesn't break.
#   With `hit_wall_exit` and `hit_wall_exit_early`, thrown and moving
#   right, it opens wall exits those boxes hold, as `hit_thrower` does
#   throwers.
# - `thrower`: never moves, and throws a `ball` on a timetable:
#   `throws = [[frame, vx, vy], ...]`, up to four, each on that frame of
#   every `period` frames, counting from 0 on the frame it appeared on,
#   at that speed, from `throw_from = [x, y]` away from its position. A
#   thrown ball moves on the frame it's thrown. With a preset that has a
#   view, a thrower appears and is removed as a walker on its own does,
#   and starts its timetable again each time it appears. Knocked out, it
#   stops throwing and leaves as a defeated walker does, by `defeat_jump`,
#   `defeat_gravity` and `defeat_max_fall`, through every floor; with a
#   `window` and a view, it's removed outside it as a ball is, on the
#   frames it moves, instead of when it's far from the view, and without
#   one once its top is below the level. It never comes back.
#   With a `contact` table, it hurts the player, on the next frame, when
#   the player's offsets from it at the end of a frame are within the
#   range for the player's pose then, `[across from, to, above from,
#   to]` as a ball's: `upright`, or `airborne` (the poses and their
#   timings are a ball's; crouching, the fidget and the rolling pose take
#   `upright`'s, and a player rolling or in the first `roll_stop_guard`
#   frames of the stop after a roll isn't hurt). On the ground with `above` at `ledge`,
#   on its ledge, only `across` counts, and not at the end of the frame
#   the player lands on. It doesn't hurt on the frame before one of its
#   throws, nor on the frame after a bounce. A player in the air after
#   its move, not rising at the preset's `bounce_max_rise` or faster,
#   with its offsets then within `bounce`, bounces off it (as off a
#   walker, by the preset's `bounce_speed` and `bounce_freeze`), which
#   knocks it out; it holds still on the bounce's frozen frames. With a
#   `roll` range, a rolling player on an attack frame (the preset's: a
#   roll's frames and the first `roll_attack_stop` of the stop) with its
#   offsets after its move within it defeats it, as a walker hit by the
#   preset's attack box, which knocks it out; on the roll's first frame
#   the offsets from where the player was before it count too. Facing
#   left, each `across` turns around as a ball's, by `mirror`. Knocked
#   out, it touches nothing. `crouching` and `fidget` (each `[across
#   from, to]`, `above` being upright's) are the first character's
#   ranges crouching, and for `crouch_hold` frames after Down is let go,
#   and in the fidget pose. With a `contact.second` table (`standing`,
#   `moving`, `bounce`, each `[across from, to, above from, to]`, and
#   `air_hold`; `crouching` as above and `crouch_hold`), a character
#   other than the first is hurt by `standing` (standing still on the
#   ground) or `moving` (the rest, and `air_hold` frames after landing
#   from a jump standing still), by `crouching` while crouching, its roll defeats it within
#   `roll` (`across` only, else the contact's), and it bounces off it by `bounce`; the rest is as above.
#   Without `contact`, it doesn't touch the player; its balls can.
# - `ball`: falls under `gravity`, up to `max_fall`; nothing changes its
#   speed across. Its floor is the highest in the 1-px column of its x
#   that's no more than `floor_reach` above where it was at the start of
#   the frame. Moving down to less than `touch` above that floor, or
#   below it, it bounces: it's put on the floor moving up at `bounce`,
#   then passes through every floor until it's more than `drop` below
#   that one. It passes through walls. With a view, it's removed outside
#   `window = [left, right, top, bottom]`, how many px past each edge of
#   the picture its x, rounded down, and its y, rounded up, may be, with
#   the view where it was at the start of the frame; not on a frame on
#   which it bounced or stopped passing through floors, though. Without
#   a view, it's removed once its top is below the level. Placed in a
#   level, it starts at `velocity = [x, y]`, and with a view appears as
#   a walker on its own would, moving on the frame it appears, once.
#   With a `contact` table, it hurts the player, on the next frame, when
#   the player's offsets from it at the end of a frame are within the
#   ranges for the player's pose then: `[across from, to, above from,
#   to]`, whole px, ends included, where `across` is the player's x less
#   the ball's, both rounded down, and `above` the player's y less the
#   ball's, both rounded up. The ranges are for facing right; facing
#   left, `across` turns around to from `mirror` - (to) to `mirror` -
#   (from). The poses: `upright` (standing, walking, running, turning, the ground
#   action, and a jump up to `upright_jump` frames after the one it
#   starts on), `airborne` (the rest of a jump, other times in the air,
#   and after landing up to `land_hold` frames after the landing frame,
#   by how the player went into the air: a jump standing still held
#   until it lands, `still`, or let go of before, `hop`; a jump while
#   moving, `moving`; out of a roll, `roll`; without jumping, `fall`),
#   `rolling` (during a roll, and `roll_after = [on, stopped]` frames
#   after it, when it ran on into a run or not), `crouching` (down held
#   on the ground, outside the ground action) and `fidget` (standing
#   still: `fidget_time = [start, length, every]` frames into standing,
#   for `length` frames, then again every `every`). As the ball flies it
#   turns: `turn = [[steps, across, above], ...]`, up to eight parts in
#   order, each lasting `steps` of its steps and moving both ends of each
#   range by `across` and `above`, by the part it was in before its move
#   on the frame. Its steps count from 0 at its start, and one more on
#   each frame it moves without bouncing or stopping passing through
#   floors. A ball hurts on no frame on which it bounced or stopped
#   passing through floors. With a `contact.second` table
#   (`standing`, `moving`, `crouching`, as above, and `air_hold`,
#   `crouch_hold`), a character other than the first is reached by those
#   ranges instead: `moving` is walking, running, rolling and the air
#   from a jump's press frame, up to `air_hold` frames after landing
#   from a jump standing still; `crouching` is down held on the ground
#   and `crouch_hold` frames after; `standing` the rest, turning
#   included. Nothing changes the ball. Without `contact`, it doesn't
#   touch the player.
# - `stinger`: an enemy that sways around its start, horizontally and
#   vertically, passing through floors and walls. Its turning points are
#   `reach = [left, right, up, down]` whole px (0 to 255) from its start.
#   It starts at `velocity = [x, y]`; its target speed keeps that size,
#   heading left while negative (otherwise right) and down while positive
#   (otherwise up). Each frame: past the turning point it heads for (x
#   rounded down), it's put 1/2 px on its near side of it and its target
#   across changes sign; its speed across eases 1/32 of the way to the
#   target, rounded toward zero to 1/256 px (or reaches it, if that
#   rounds to 0); it moves across; past its vertical turning point (y
#   rounded up), it's put 1/2 px beyond it and its target up and down
#   changes sign; it moves by its vertical speed from before the frame,
#   which then eases as the speed across does. With a view, it appears
#   and is removed as a walker on its own does, coming back afresh: at
#   its start, at `velocity`, not moving on the frame it appears. It
#   hurts the player by its `contact` table, as a ball's, without a turn
#   (`turn = []`), or by the `second` table (`upright`, `moving`,
#   `crouching`, `fidget`, each `[across from, to, above from, to]`) when
#   the character under control is not the first; facing left, those
#   turn around by the contact's `mirror`. Nothing defeats it and it's never bounced on. While
#   the player is knocked out, it holds still with the other enemies,
#   also when it's the one that hurt the player.
# - `collect`: a collectible the player takes by reaching it. It's then
#   gone, and adds `worth` to the collectible count, one at a time: the
#   first as it's taken, then one every `release_every` frames, each
#   arriving `count_delay` frames after that. Its position is its middle.
#   `reach` is one table, or two: the first character's, then the one
#   for any other (left out: the first's). Each says where the player
#   takes it from, as `[past from, to, below from, to]`, whole px, ends
#   included: how far the player's x, rounded down, is past the
#   collectible's the way the player faces (facing left, from
#   `left_shift` px right of it; left out: 0), and how far the player's
#   feet, rounded up, are below it. Which applies depends on what the
#   player is doing at the end of a frame: `stand`, `walk` (walking or
#   running), `crouch` (down held on the ground), `roll`, `jump` (for the
#   first `jump_early` frames of a jump, counting the one it starts on),
#   and `air` (the rest of a jump, or in the air another way, and for the
#   first `land_hold` frames after landing, counting the landing, or
#   `land_ran` with Action and a direction held on the landing frame; left
#   out, `land_hold`; `land_drop = [px, frames]` adds that many frames
#   after landing more than so many px below where the player went into
#   the air; `land_held = [[from, to, frames], ...]`, up to 4 rows, adds
#   frames after a jump Jump was held for `from` to `to` frames).
#   `roll_after = [on, stopped]` (left out: `[0, 0]`) keeps
#   `roll` for so many frames after a roll ends, counting the first one
#   after it, when it ran on into a run or not. With `upright_fall =
#   true`, a fall after walking off a ledge without a face, and the
#   frames after its landing, take the ranges on the ground instead of
#   `air`. `bounce = [past from, to, below from, to]` (left out: a
#   bounce is in the air as any other time) applies from a bounce's
#   frame until it lands, except on the frames the player holds still
#   after it, when it isn't taken at all; from the landing frame on,
#   the ranges on the ground apply. `carry = [past from, to, below
#   from, to]` (left out: carrying changes nothing) applies above all
#   the others from a pick-up to the end of a throw, even one a jump or
#   a roll ends sooner, or to the frame before a put-down sets the
#   object down; a jump that took off then has the ranges on the ground
#   for the rest of it and after its landing, instead of `jump` and
#   `air`. The ground action takes `stand`, also in the air. In the
#   air after `jump`, `air_below = [[vy, below], ...]` lifts the lowest
#   `below`: the first pair whose `vy` is at least the player's vertical
#   speed gives it, past them all it's `air`'s. Only the character under
#   control takes collectibles. With a preset that has a view
#   (`view_width` above 0), `window = [from, to]` limits where it's taken:
#   its x less the view's left edge, both rounded down, must be in it,
#   with the view where it is after moving on that frame (`[]` or left
#   out: anywhere). With a view, `arrive` also decides when each part of
#   what it's worth reaches the count, by where the collectible is in the
#   view on the frame it's released: a list of up to four rules
#   `{ x_from, x_to, y_from, y_to, delay }`, where `x` and `y` are its
#   position less the view's left and top edges, rounded down, ends
#   included, and any end left out is open. `y` always holds without
#   vertical view motion. The first rule that holds gives `delay`, in
#   frames after the release, or "never"; with none, `arrive_else` does
#   (left out: `count_delay`). `arrive_view` says which view: "end", where
#   it is after moving on that frame (the default), or "start", where it
#   was before. `worth` may be 0. With `letter` above 0 (up to 8; left
#   out: 0), it's that letter of the level's word: taken, it joins the
#   letters taken `join_delay` frames later (left out: 0), and the
#   letter row is shown. The preset's `letter_count` says how many
#   letters the word has, and all of them give one more life. With a
#   preset that has a count display (`count_show_for` above 0), the
#   display waits on what it's worth from `pickup_start` frames after
#   it's taken (left out: 0). With `relic = true`, taken, it adds one to
#   the relic count. Taken, it gives `lives` more lives (left out: 0),
#   and the lives display shows them (the preset's `life_item_*`). With
#   `rise` above 0 (px per frame), it rises from the frame it appears:
#   its speed up grows by `rise` each frame, from 0 on that frame, and
#   it's gone on the first frame it would be at the level's top or above
#   it. Its y, rounded up, is then what the player's feet are measured
#   from. With a view and `once = true`, it appears when its position
#   comes near the view, as a thrower does, and is removed on the first
#   frame it isn't near; removed or risen out, it doesn't come back.
#   With `kept = true`, taken, it stays gone when play comes back to the
#   level from another area (an exit's `arrival`); otherwise it's there
#   again then, as at the level's start. With `late = true`, taken, it
#   acts on the lives display as if taken a frame later: the display
#   comes in, holds its steps and counts its lives from then. With
#   `copy = { from, corner }`, each part released that reaches the count
#   after more than a frame has a copy of the collectible's image drawn
#   flying from its place to the picture's top left corner, on the
#   frames from `from` (0 or 1) after the release to one before the
#   count goes up (collectibles.md, "The flying copy"; bunches.md, "The
#   flying copy of an item"). It starts at the collectible's position
#   less the view's, by `arrive_view`'s view, less `corner`: how far left
#   of and above the position the image's corner is.
# - `hutch`: a crate holding an animal. It stands on its position and
#   never moves; walking, running or rolling through it does nothing.
#   Offsets from it are whole px, ends included: `across`, the player's
#   x rounded down less the crate's, and `above`, the crate's y less the
#   player's feet line (its y rounded up). Each `*_across` is
#   `[[from, to], [from, to]]`, the range for facing right, then for
#   facing left. A player in the air that moved down on a frame, not
#   rolling, within `break_across` and `break_above` at the end of the
#   frame breaks it (with `second_break_across` and `second_break_above`
#   for the second character, if given), once, and bounces off it as off a walker (the
#   preset's `bounce_speed` and `bounce_freeze`). `animal_after` frames
#   later the animal comes out where it stood, `animal_hop = [px, ...]`
#   above the crate's position on that frame and the ones after (up to
#   eight), then on it, where it stays. From then on, a player in the air
#   after a jump or a bounce, moving down, not rolling, that would be
#   within `mount_across` and `mount_above` after its move on a frame
#   mounts the animal: it's moved by whole px so that its x rounded down
#   is the crate's and its feet line is the crate's y, stops moving down,
#   keeps its speed across, and holds still for `mount_hold` frames.
#   Then its feet are put on the crate's y, on the ground there, and it
#   rides the animal, as its `ride` table says (all speeds px/frame):
#   the target speed is `speed` with Left or Right held, `run_speed`
#   with Action too, and 0 with no direction; each frame closes
#   `response` of the gap to it (`steer_response` on frames steered by a
#   jump), in whole 1/256 px. Holding the way it doesn't face turns it in
#   `turn` frames, facing changing on frame `turn_face`. With the second
#   character as the player, `ride.second` gives `speed` and `run_speed`
#   instead, with `ride.second.hop_gravity` for a hop off's held gravity
#   and its own `off_landing`. A Jump press,
#   or one up to `jump_memory` frames before still held, starts a jump
#   from the floor: `crouch` frames, then `jump_speed` up, then the
#   preset's jump gravity, and `landing` frames after landing. An Action
#   press starts a charge: `hop_at` frames later it hops at `hop_speed`
#   if on the floor, and from `charge` frames on, once on the floor, a
#   `charge_end` frames long end. Floor up to `follow` lower is
#   followed; lower floor, or none, is left by moving `leave_drop` plus
#   the gravity down, at `leave_speed`. On a steep face a held direction
#   up it counts as none and no jump starts; the frames after one ending
#   on it add `push` down it to the target speed, unless steered; and the
#   face's low end over a drop is always left. A jump landing up to
#   `approach_steer` frames after its approach frame (the first, after it
#   starts falling, with floor below at most `approach_reach` px and
#   `approach_rows` rows of `approach_row` px down) stays steered until
#   then and rides on `approach_land` frames after it. A walker in front
#   of the animal (its `rider` table) starts a charge on the next frame
#   unless one is under way, ending what the rider was doing; from
#   `throw_from` frames into a charge it's thrown, out of the level as
#   when defeated, and the rider's speed becomes `throw_rise` up. A walker
#   that knocks the rider off: the player doesn't move on that frame, its
#   speed becomes `knock_rise` up, and it holds still with everything
#   else for `knock_hold` frames, then falls on foot, facing as it was
#   until it lands. The animal runs off the way the rider faced, after
#   those frames: at `bolt_speed` for `bolt_dash` frames, then easing
#   toward `bolt_glide` by `bolt_response` of the gap a frame. A Tandem
#   press gets off: the speed across follows the riding rule once more,
#   the speed up becomes `off_rise` plus the frame's gravity, and the
#   player is on foot in the air. With a riding jump starting, it's a
#   jump off, taking off on the next frame; otherwise a hop off, facing as
#   it was until `off_landing` landing frames after it lands. The animal
#   stays where the rider was, facing the same way; above the floor it
#   falls `drop_first`, then `drop_second`, then `drop_gravity` more on
#   each frame, until it would be less than `drop_land` above the floor.
#   It's got on again as from the crate, its ranges turned around if it
#   faces left. Only the character under control breaks a crate or
#   mounts an animal.
# - `keg`: a restart barrel, centred on its position, which never moves.
#   The character under control touches it by its `contact` table, as a
#   ball's without a turn, at the end of a frame after its move; it then
#   breaks, once, and is gone, and its position becomes where play
#   resumes after a lost life. Both last when play comes back to the
#   level from another area. Touching it changes nothing about the
#   player. It breaks into four `pieces = [[across, up], ...]`, each
#   moving across by its `across` every frame and up by its `up` at the
#   start, less `piece_gravity` every frame, and a flash rising
#   `flash_rise` a frame, which last `burst_time` frames. Play resumes
#   there inside a keg, counting frames from 0: the player is at the
#   keg's position, with the view's left edge `view_back` px left of it;
#   from frame 1 it's `lift` px higher and not drawn, and nothing moves
#   or takes input until the keg bursts on frame `burst`, as when
#   broken. From the frame after, the player is in the air and in play.
#   The keg in the meantime shakes sideways by `shake = [[from, first,
#   second], ...]` (up to four, in order): from frame `from`, by `first`
#   px on the first two of every four frames and `second` on the other
#   two (0 before the first). The picture is black up to frame
#   `fade_from` and fades in from there, a step of brightness every
#   `fade_step` frames. The first landing after the burst has a landing
#   lockout of `land_lockout` frames, instead of the preset's.
# - `entrance`: where the characters come out when the level begins,
#   centred on its position, which never moves; only a level's first one
#   counts. Counting the level's frames from 0, the characters wait at
#   the level's start, hidden, and nothing moves or takes input up to
#   and including frame `throw`. On frame `burst` it bursts as a keg
#   does, by its own `pieces`, `piece_gravity`, `flash_rise` and
#   `burst_time`. On frame `throw` it's gone, and the lead is drawn and
#   thrown out at `throw_speed = [across, up]` without moving yet. It
#   moves by that speed for `rise` frames, then its speed down first
#   grows by `gravity` each frame, up to `max_fall`, facing right and
#   taking no input. From `steer_from` frames after the throw up to and
#   including the landing, its speed across eases toward the air's
#   target speed (`walk_speed`, or `top_speed` with Action) by
#   `steer_response` of the gap, rounded as `speed_response` is. With the
#   preset's `bounce_landing_switch` the landing is a bounce's: a gait
#   starts on it (with `bounce_keeps_facing`), the landing lockout counts
#   from it, Jump presses in the throw count as presses in the air, and
#   an Action press on it waits a frame for a roll. Without, there's no
#   landing lockout and only a Jump press on the landing frame counts.
#   From the frame after the landing it plays as usual.
#   The other character waits there until the frame after the throw;
#   until the lead lands, it's then where the lead was on the frame
#   before, rounded down to whole px, and follows it after that. The
#   picture fades in from black: after frame `f` the brightness is
#   `f` / `fade_step` steps, rounded down, out of `fade_steps`.
# - `hidden`: a hidden object, which never moves, isn't drawn, isn't in
#   the way and never hurts. Offsets from it are whole px, ends
#   included: `across`, the player's x rounded down less its own, as
#   `[[from, to], [from, to]]` for the player facing right, then left;
#   and `above`, its y less the player's feet line (the player's y
#   rounded up), `[from, to]`; a character other than the first is set
#   off by a fall by `second_across` and `second_above` instead, if
#   given together. It's set off at the end of a frame, after
#   the player's move, with the offsets within those ranges. With
#   `fall_height = 0`, the ground action sets it off on its attack frames
#   that are in `strike_frames`, and pauses as when it knocks out a
#   walker. Otherwise a player in the air, not landing and not rolling,
#   sets it off if its feet line has been `fall_height` px or more above
#   the object's y at the end of a frame since it last stood on a floor,
#   and bounces off it as off a walker. Set off, it's gone for good and
#   its item is where it was, drawn as what it becomes, moving at
#   `item_speed = [across, down]`. It stays put for `item_wait` frames,
#   then each frame its speed down grows by `item_gravity`, up to
#   `item_max_fall`, and it moves; moving down to less than `item_touch`
#   above the floor under it, it's put on that floor. On the frame after
#   it moves across once more, and on the next it becomes a `becomes`
#   (`"cluster"`, `"crate"` or `"canister"`), `becomes_at = [x, y]` from
#   where it stands. In the air it holds still on the ground action's
#   pause frames. An item, or what it became while standing (not in the
#   hands or thrown), is removed for good outside the window placed
#   objects appear in.
# - `spring`: a spring the player stands on, which never moves and
#   doesn't fall. Offsets from it are whole px, ends included: `across`,
#   the player's x rounded down less its own, as `[[from, to], [from,
#   to]]` for the player facing right, then left; and `up`, how far the
#   player's feet line is above its y rounded down. Its top is `top` px
#   up at rest. The player touches it with `across` in range and `up`
#   within `reach = [from, to]` of the top, at the end of a frame after
#   its move. Touched at rest or wobbling, it catches a player on the
#   ground, not taking off, or in the air falling, `up` no more than
#   `catch_below` under the top: the player is put on the top, `up` whole
#   px `stand` above it, keeping the fraction, and stands there. The
#   spring squashes, its top as `squash = [[top, frames], ...]` says,
#   putting a player that touches it and isn't rising back on the top.
#   On the frame after, it throws a player with `up` within `throw_up`
#   at `throw_speed` up: the player holds still on the frame after that,
#   then flies under `gravity` up to `max_fall`. The spring catches
#   nothing for `throw_rest` frames after a throw, and wobbles, its top
#   as `wobble` says, but not on frames a player touches it without being
#   caught. A player on the top goes `drop` down with each move; one the
#   spring doesn't put back leaves the top on the next frame, `leave_drop`
#   down. A Jump press there makes a spring jump at `jump_speed` up on
#   that frame, falling under `jump_gravity` while Jump stays held, then
#   `gravity`. A player caught in the air can't spring-jump until
#   `jump_wait` frames after the catch, and then only with a press made
#   up to `jump_early` frames before the catch and held since, or a new
#   one.
# - `rope`: a rope hanging from out of sight down to its bottom end, its
#   y, which the player catches from a jump and holds. It sways around
#   where it's placed: its target speed is `speed` one way or the other,
#   turning once its x rounded down is more than `swing = [left, right]`
#   whole px past the place, and its speed closes `sway_response` of the
#   gap each frame. It has a player in reach with the feet line no more
#   than `below` px under the bottom end and the x's rounded down less
#   than `near` px apart, or `far` with the player moving at `slow` or
#   faster. Holding it, the player climbs toward `up` (Up, or Jump alone)
#   or `down` (Down), each `[without Action, with Action]` px a frame,
#   closing `climb_response` of the gap each frame, and no higher than
#   `view_top` px under the view's top. Holding the way it faces swings
#   it round in `turn_frames`, facing the other way from the
#   `turn_facing`th. Jump with Left or Right jumps off at `jump_speed` up,
#   plus one frame's climbing toward the target without Jump.
# - `sling`: a launch barrel, which never moves. At the end of a frame,
#   after the player's move, it catches a player within its `reach`, a
#   table as a collectible's (see `collect`), measured `left_shift` px
#   right of it facing left. The player stops there, and on the next
#   frame is moved by whole px onto the sling's position, its feet line
#   on its y, and held, facing as it was, until `hold` frames after the
#   catch. On the frame after those it's shot at `shot = [x, y]` (+y
#   down), facing left if that's leftward and right otherwise, without
#   moving yet, and the sling is gone if it `breaks`. It moves at that
#   speed for `glide` frames, and then flies until it lands: each frame
#   its speed across closes `steer_response` of the gap to `steer` toward
#   the way held (to 0 with neither), rounded toward zero to 1/256 px a
#   frame, and its speed down grows by `gravity` up to `max_fall`. Nothing
#   held makes a difference before the flight. After a catch, the sling
#   catches no one for `rest` frames. A character other than the first is
#   caught by `second.reach` and steers toward `second.steer`; the first
#   character standing for steps `long_stand.from` to `.to` into the
#   standing pose is caught by `long_stand.span` instead of its stand row.
# - `critter`: scenery that flies. It appears as scenery does, but
#   somewhere across the top of the picture, at a random speed across of
#   up to 2 px a frame either way and down of up to 2 px a frame, and
#   flies towards its start: each frame its speed across closes 1/32 of
#   the gap to 1/16 of the distance across, and its speed down 1/64 of
#   the gap to 1/64 of the distance down, rounded to 1/256 px a frame.
#   It's drawn `flutter` px (one value a frame in turn, from place
#   `flutter_from` at the world's first frame) above its flight height.
#   On ending a frame with its x rounded down less its target's within
#   `perch_across = [low, high]` and its drawn y rounded up less its
#   target's within `perch_down`, it perches: it stays there for `perch`
#   frames, flying again on the last, at `launch = [x, y]`, towards a new
#   target `hop = [across, y]` px across from the old one at level y
#   `y`. One there on the world's first frame stands `settle` frames at
#   its start's height first. It's removed once neither it nor its start
#   is near the view, and appears afresh the next time its start is.
#   It holds still on frames that hold walkers still.
# - `scenery`: stands where it's placed and nothing touches it: it isn't
#   in anyone's way, never hurts and is never taken. With a view, it's in
#   the level while its position is near the view, as a thrower is, and
#   comes back each time it's near again.
#
# The player defeats an enemy by landing on it, and bounces off, or by
# rolling into it. Touching one any other way costs a life.
#
# Units: px and frames at 60 Hz, +y down. Speeds are px/frame. These are
# Clamber's own values, except where a comment says otherwise.

[archetypes.crawler]
behavior = "walker"
size = [20, 18]
offset = 0
speed = 0.5
response = 0
facing = "left"
turn_delay = 0
appear_wait = 0
group = 0
range = []
defeat_jump = 5
defeat_gravity = 0.375
defeat_max_fall = 8
defeat_knock = 4
defeat_knock_glide = 2

# title-1's small walker's (spec/behavior/riding-walkers.md).
[archetypes.crawler.rider]
attack_across = [[-55, 24], [-56, 23]]
attack_above = 25
knock_across = [[-18, 26], [-19, 25]]
knock_above = -3
throw_speed = 2

[archetypes.flutter]
behavior = "patrol"
size = [18, 16]
offset = 0
path = [0, -64]
period = 180

[archetypes.launcher]
behavior = "launcher"
size = [24, 16]
offset = 0
velocity = [0, -13.5]

# title-1's barrel (spec/behavior/carrying.md, "Reach"): the player picks
# it up from within `reach`: the object's `x` rounded down less the
# player's, by the way the player faces, and its `y` rounded up less the
# player's, `below`, ends included.
[archetypes.crate]
behavior = "carry"
size = [32, 24]
offset = 0
reach = { right = [-7, 38], left = [-33, 12], below = [-22, 32] }
# title-1's (spec/behavior/thrown-objects.md, "Hitting walkers"), with
# its small walker's box (`size = [20, 12]`, `offset = 0.5`). A walker
# with a `thrown_lower` sets how far below it a thrown object still hits
# (the importer gives the walkers one); `above` is the limit for the
# others, up to just under 13.
hit = [18, 13, 13, 18]
hit_early = [19, 38, 13, 51]
hit_early_time = 16
# title-1's (spec/behavior/thrown-objects.md, "Hitting the thrower"),
# the ranges of I and H turned around. Moving left they're moved 1 px.
hit_thrower = [36, 30, 23, 32]
hit_thrower_early = [37, 55, 47, 65]
hit_thrower_turn = 1
# title-1's (spec/behavior/thrown-objects.md, "A carried object"): the
# ranges for a player facing right are those of `hit` moving right, and
# facing left they're moved 5 px left.
hit_carried_turn = 5
# title-1's (spec/behavior/carrying.md, "The object in the hands"),
# measured on flat floor; the engine uses them everywhere.
in_hands_pick_up = [
    [20, 3], [20, 3], [20, 15], [20, 15], [20, 27], [20, 27], [20, 33],
    [20, 33], [4, 38], [4, 38], [-2, 39], [-2, 39], [-2, 39], [-2, 39],
]
in_hands_throw = [
    [2, 46], [-6, 47], [-6, 47], [-18, 48], [-18, 48], [-30, 44], [-30, 44],
    [-40, 39], [-40, 39], [-38, 39], [-38, 39], [-36, 38], [-36, 38],
    [-32, 39], [-32, 39], [-28, 41], [-28, 41], [-24, 45], [-24, 45],
    [-7, 54], [-7, 54], [0, 54],
]
in_hands_put_down = [
    [-2, 39], [4, 38], [4, 38], [20, 33], [20, 33], [20, 27], [20, 27],
    [20, 15], [20, 15], [20, 3], [20, 3], [16, 3], [16, 3], [16, 3],
]
# With the second character under control (carrying.md, "The object,
# second character"), measured with a `barrel` and used for every object.
in_hands_second_pick_up = [
    [12, -8], [16, -7], [16, -7], [16, -1], [16, -1], [14, 3], [14, 3],
    [12, 8], [12, 8],
]
in_hands_second_throw = [
    [8, 11], [4, 13], [4, 13], [-7, 11], [-7, 11], [-7, 11], [-16, 9],
    [-16, 9], [-16, 9], [-16, 9], [-16, 9], [-15, 9], [-15, 9], [-15, 9],
    [-12, 9], [-12, 9], [0, 9], [0, 9], [0, 9],
]
in_hands_second_put_down = [
    [12, 8], [12, 8], [14, 3], [14, 3], [16, -1], [16, -1], [16, -7],
    [16, -7], [12, 3], [12, 3], [12, 3],
]
# Carried (spec/behavior/thrown-objects.md, "The second character"): the
# spec gives 11 to 12 px ahead and 9 to 11 px above, not which frame has
# which; the engine holds it 12 ahead (where the pick-up ends) and 10 up.
in_hands_second_carried = [[12, 10]]
# title-1's (spec/behavior/thrown-objects.md, "Hitting a ball"), the
# ranges of I and H turned around, early and late as for the thrower.
# Moving left I is 1 less (the box moved 1 px right); upside down (the second and third
# parts of the ball's turn) H is 3 less, mirrored (the third and fourth)
# I is 1 more.
meets_ball = [26, 22, 30, 15]
meets_ball_early = [27, 47, 54, 48]
meets_ball_turn = -1
meets_ball_parts = [[0, 0], [0, -3], [1, -3], [1, 0]]
# Set `holds_character = true` on an entity to make it hold the
# missing character. title-1's (spec/behavior/holder-breaking.md): it
# breaks outside the same window around the picture a ball leaves, on
