# title-1's restart barrel (spec/behavior/restart-barrel.md). The player
# touches it by the ranges for its pose, the ball's poses with the ball's
# timings; `above` is the spec's D turned around (the player's feet line
# less the keg's position). Touched, it breaks into four pieces and a
# flash, and the level's restart point, its position, is reached.
# Resuming there, the player waits in a keg `lift` px above it until it
# bursts on frame `burst`, with the view `view_back` px left of it on
# frame 0, and the keg shakes by `shake`: [from, first, second] stages,
# the first offset on the first two of every four frames from `from`,
# the second on the other two. The spec doesn't say how big the barrel
# is, where the pieces and the flash start or how long they last, or how
# fast the picture fades in: `size`, `burst_time` and `fade_step` are
# Clamber's own. Jump held from the fall on jumps on the frame after
# landing: no lockout.
