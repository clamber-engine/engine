name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # rebuild main by hand, e.g. after changing signing settings

# Agents push often; a newer push makes older runs on the same branch moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firewall:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: No ROM images
        run: ci/forbid-roms.sh
      - name: Taint lint
        run: ci/taint-lint.sh

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # spec is private, so the submodule is fetched with a read-only
      # deploy key on clamber-engine/spec.
      - name: Fetch spec submodule
        env:
          SPEC_DEPLOY_KEY: ${{ secrets.SPEC_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SPEC_DEPLOY_KEY" > ~/.ssh/spec_key
          chmod 600 ~/.ssh/spec_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/spec_key -o IdentitiesOnly=yes"
          git config --global url."git@github.com:clamber-engine/spec".insteadOf "https://github.com/clamber-engine/spec"
          git submodule update --init

      # System libraries for optional features: gamepads (libudev), audio
      # output (ALSA), and windowing (X11/Wayland, xkbcommon).
      - name: System libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libudev-dev libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked

  # A playable Windows build, downloadable from the run's Artifacts, once
  # the game crate exists.
  windows-build:
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write # Azure login for code signing, without a stored secret
    steps:
      - uses: actions/checkout@v7
      - name: Check for the game crate
        id: game
        shell: bash
        run: |
          if [ -f crates/game/Cargo.toml ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Rust build cache
        if: steps.game.outputs.exists == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        if: steps.game.outputs.exists == 'true'
        run: cargo build --release --locked -p clamber-game --all-features
      # Code signing (Azure Trusted Signing) so Windows Smart App Control
      # accepts the build. Only on main, and only once the certificate
      # profile is configured in the repository variables.
      - name: Azure login
        if: steps.game.outputs.exists == 'true' && github.ref == 'refs/heads/main' && vars.AZURE_SIGNING_PROFILE != ''
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign
        if: steps.game.outputs.exists == 'true' && github.ref == 'refs/heads/main' && vars.AZURE_SIGNING_PROFILE != ''
        uses: azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\target\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Check the signature
        if: steps.game.outputs.exists == 'true' && github.ref == 'refs/heads/main' && vars.AZURE_SIGNING_PROFILE != ''
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem target\release\*.exe) {
            $s = Get-AuthenticodeSignature $f.FullName
            "$($f.Name): $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { throw "$($f.Name) is not validly signed" }
          }
      - name: Package
        if: steps.game.outputs.exists == 'true'
        shell: bash
        run: |
          mkdir -p dist/clamber
          cp target/release/*.exe dist/clamber/
          cp -r content dist/clamber/
          [ -f PLAYING.md ] && cp PLAYING.md dist/clamber/ || true
          [ -f content/base/CREDITS.md ] && cp content/base/CREDITS.md dist/clamber/ || true
      - name: Upload
        if: steps.game.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: clamber-windows
          path: dist/clamber
          retention-days: 14

  # Screenshots and a gameplay GIF of the newest main, published to the
  # `media` branch for the README, once tools/capture.sh exists.
  media:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    needs: [firewall, test]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check for the capture script
        id: capture
        run: |
          if [ -f tools/capture.sh ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: System libraries (incl. software Vulkan)
        if: steps.capture.outputs.exists == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libudev-dev libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev mesa-vulkan-drivers
      - name: Rust build cache
        if: steps.capture.outputs.exists == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Capture
        if: steps.capture.outputs.exists == 'true'
        run: bash tools/capture.sh "$RUNNER_TEMP/media"
      - name: Publish to the media branch
        if: steps.capture.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/media"
          printf 'Captured from %s (%s)\n' "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%MZ)" > README.md
          git init -q -b media
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Media for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" media
